<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171719">
  <title>Echoes Music Player | Shidanna</title>

  <style>
    :root {
      --background: #171719;
      --panel: #30272A;
      --red: #A51F2B;
      --red-hover: #C02A37;
      --ivory: #F0E9D9;
      --muted: #C5B8B0;
      --line: #514044;
      --gold: #B6A078;
      --progress: 0%;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--background);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      background: var(--background);
      color: var(--ivory);
      font-family:
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 4px;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       曲一覧
    ========================= */

    #listScreen {
      width: min(100%, 520px);
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding: 34px 24px;
      background:
        radial-gradient(
          ellipse at top,
          #493238 0%,
          transparent 52%
        ),
        linear-gradient(
          160deg,
          #30272A,
          var(--background) 70%
        );
    }

    .library-header {
      margin: 10px 0 38px;
    }

    .eyebrow {
      margin-bottom: 12px;
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 10px;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .library-title {
      margin: 0;
      font-family: Georgia, "Yu Mincho", serif;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: .08em;
    }

    .library-subtitle {
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .12em;
      line-height: 1.8;
    }

    .section-label {
      margin: 0 0 14px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: .22em;
    }

    #trackList {
      display: grid;
      gap: 3px;
    }

    .track {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 12px 6px;
      border: 0;
      border-bottom: 1px solid #ffffff13;
      background: transparent;
      text-align: left;
      transition: background .2s ease;
    }

    .track:hover,
    .track:focus-visible {
      background: #A51F2B22;
    }

    .track-cover {
      display: block;
      width: 58px;
      height: 58px;
      flex-shrink: 0;
      border: 1px solid #ffffff22;
      background: var(--panel);
      object-fit: cover;
    }

    .track-info {
      flex: 1;
      min-width: 0;
    }

    .track-title {
      display: block;
      color: var(--ivory);
      font-size: 13px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .track-subtitle {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .18em;
    }

    .track-arrow {
      flex-shrink: 0;
      padding: 0 5px;
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 23px;
    }

    .library-footer {
      margin-top: 42px;
      color: #a99a94;
      font-family: Georgia, serif;
      font-size: 9px;
      letter-spacing: .24em;
      text-align: center;
    }

    /* =========================
       ECHOES風の再生画面
    ========================= */

    #playerScreen {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      padding:
        max(24px, env(safe-area-inset-top))
        26px
        max(26px, env(safe-area-inset-bottom));
      background: var(--background);
    }

    /* 選択中のジャケットをぼかして背景に使用 */

    #playerScreen::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: -45px;
      background-image: var(--cover-bg, none);
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      filter: blur(35px) brightness(.7) saturate(.8);
      transform: scale(1.12);
      opacity: .9;
      transition: opacity .5s ease;
      pointer-events: none;
    }

    /* 背景を暗くして文字を読みやすくする */

    #playerScreen::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background:
        radial-gradient(
          ellipse at 50% 40%,
          #17171918 0%,
          #17171968 55%,
          #171719e8 100%
        ),
        linear-gradient(
          180deg,
          #17171970 0%,
          #17171938 35%,
          #171719a8 75%,
          #171719f5 100%
        );
      pointer-events: none;
    }

    /* 再生中だけ背景の光がゆっくり動く */

    #playerScreen.is-playing::before {
      animation: backgroundDrift 18s ease-in-out infinite alternate;
    }

    @keyframes backgroundDrift {
      from {
        transform: scale(1.12) translate3d(-5px, 0, 0);
      }
      to {
        transform: scale(1.18) translate3d(5px, -8px, 0);
      }
    }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      flex-shrink: 0;
    }

    .back-button {
      padding: 10px 0;
      border: 0;
      background: transparent;
      color: var(--ivory);
      font-size: 12px;
      letter-spacing: .04em;
      opacity: .9;
    }

    .back-button:hover {
      color: var(--gold);
    }

    .now-playing {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .2em;
    }

    /* 中央のジャケット */

    .player-main {
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      padding: 28px 0 34px;
    }

    .cover-stage {
      position: relative;
      display: grid;
      width: 100%;
      place-items: center;
      margin: 0 auto 28px;
    }

    /* ジャケットの周りの柔らかな光 */

    .cover-glow {
      position: absolute;
      width: min(82vw, 340px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--gold);
      opacity: .12;
      filter: blur(55px);
      transform: scale(.86);
      pointer-events: none;
    }

    #playerScreen.is-playing .cover-glow {
      animation: glowBreathing 7s ease-in-out infinite alternate;
    }

    @keyframes glowBreathing {
      from {
        opacity: .09;
        transform: scale(.82);
      }
      to {
        opacity: .2;
        transform: scale(1.03);
      }
    }

    .cover {
      position: relative;
      width: min(74vw, 310px);
      max-width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border: 1px solid #ffffff30;
      background: #30272A;
      box-shadow:
        0 25px 65px #00000050,
        0 0 0 1px #00000015;
      transform: translateZ(0);
    }

    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* 再生中のジャケットに控えめな呼吸感 */

    #playerScreen.is-playing .cover img {
      animation: coverBreathing 12s ease-in-out infinite alternate;
    }

    @keyframes coverBreathing {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.035);
      }
    }

    /* 曲切り替え時のスライド */

    .cover.slide-next {
      animation: coverSlideNext .22s ease-out both;
    }

    .cover.slide-prev {
      animation: coverSlidePrev .22s ease-out both;
    }

    @keyframes coverSlideNext {
      from {
        transform: translateX(18px);
      }
      to {
        transform: translateX(0);
      }
    }

    @keyframes coverSlidePrev {
      from {
        transform: translateX(-18px);
      }
      to {
        transform: translateX(0);
      }
    }

    /* 曲名・アーティスト */

    .track-details {
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }

    .player-title {
      margin: 0;
      font-family: Georgia, "Yu Mincho", serif;
      font-size: clamp(19px, 5vw, 23px);
      font-weight: 400;
      line-height: 1.7;
      letter-spacing: .06em;
      overflow-wrap: anywhere;
      text-shadow: 0 2px 15px #00000040;
    }

    .player-artist {
      margin-top: 8px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .25em;
    }

    .sound-line {
      width: 32px;
      height: 1px;
      margin: 20px auto 0;
      background: var(--gold);
      opacity: .75;
    }

    /* =========================
       再生バー
    ========================= */

    .playback-area {
      width: 100%;
      margin-top: 30px;
    }

    #seekBar {
      --progress: 0%;

      display: block;
      width: 100%;
      height: 4px;
      margin: 0;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      border-radius: 10px;
      outline: none;
      background: linear-gradient(
        to right,
        var(--ivory) 0%,
        var(--ivory) var(--progress),
        #ffffff40 var(--progress),
        #ffffff40 100%
      );
      cursor: pointer;
      touch-action: pan-y;
    }

    #seekBar::-webkit-slider-runnable-track {
      height: 4px;
      border: 0;
      border-radius: 10px;
      background: transparent;
    }

    #seekBar::-webkit-slider-thumb {
      width: 11px;
      height: 11px;
      margin-top: -3.5px;
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid var(--gold);
      border-radius: 50%;
      background: var(--ivory);
      box-shadow: 0 0 8px #00000030;
    }

    #seekBar::-moz-range-track {
      height: 4px;
      border: 0;
      border-radius: 10px;
      background: transparent;
    }

    #seekBar::-moz-range-progress {
      height: 4px;
      border-radius: 10px;
      background: var(--ivory);
    }

    #seekBar::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      background: var(--ivory);
      box-shadow: 0 0 8px #00000030;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      color: var(--muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      letter-spacing: .04em;
    }

    /* =========================
       再生コントロール
    ========================= */

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(28px, 8vw, 42px);
      margin-top: 25px;
    }

    .control {
      display: grid;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--ivory);
      font-size: 20px;
      transition:
        color .2s ease,
        transform .2s ease;
    }

    .control:hover {
      color: var(--gold);
      transform: scale(1.06);
    }

    .play-button {
      display: grid;
      width: 60px;
      height: 60px;
      flex-shrink: 0;
      place-items: center;
      padding: 0 0 0 2px;
      border: 1px solid #ffffff20;
      border-radius: 50%;
      background: var(--red);
      color: var(--ivory);
      font-size: 23px;
      box-shadow:
        0 8px 28px #00000030,
        0 0 25px #A51F2B20;
      transition:
        background .2s ease,
        transform .2s ease,
        box-shadow .2s ease;
    }

    .play-button:hover {
      background: var(--red-hover);
      box-shadow: 0 8px 32px #00000045;
    }

    .play-button:active {
      transform: scale(.96);
    }

    .play-button.is-paused {
      padding-left: 4px;
    }

    .player-message {
      min-height: 18px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.8;
      text-align: center;
    }

    .player-footer {
      flex-shrink: 0;
      margin-top: auto;
      padding-top: 16px;
      color: #c5b8b078;
      font-family: Georgia, serif;
      font-size: 9px;
      letter-spacing: .3em;
      text-align: center;
    }

    .fade-in {
      animation: pageFadeIn .3s ease both;
    }

    @keyframes pageFadeIn {
      from {
        opacity: 0;
        transform: translateY(7px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (min-width: 700px) {
      #playerScreen {
        padding-right: max(40px, calc((100vw - 560px) / 2));
        padding-left: max(40px, calc((100vw - 560px) / 2));
      }

      .player-main {
        padding-top: 24px;
        padding-bottom: 28px;
      }

      .cover {
        width: min(48vh, 310px);
      }
    }

    @media (max-height: 720px) {
      #playerScreen {
        padding-top: max(16px, env(safe-area-inset-top));
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }

      .player-main {
        padding-top: 12px;
        padding-bottom: 14px;
      }

      .cover {
        width: min(54vh, 260px, 72vw);
      }

      .cover-stage {
        margin-bottom: 18px;
      }

      .player-title {
        font-size: 19px;
      }

      .sound-line {
        margin-top: 13px;
      }

      .playback-area {
        margin-top: 22px;
      }

      .controls {
        margin-top: 18px;
      }

      .player-footer {
        padding-top: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- 曲一覧 -->

  <section id="listScreen">
    <header class="library-header">
      <div class="eyebrow">Echoes Music Player</div>
      <h1 class="library-title">すべての曲</h1>
      <div class="library-subtitle">
        音楽と記憶が重なる場所。
      </div>
    </header>

    <h2 class="section-label">MUSIC COLLECTION</h2>

    <div id="trackList"></div>

    <footer class="library-footer">
      MUSIC IS A MEMORY.
    </footer>
  </section>

  <!-- 再生画面 -->

  <section id="playerScreen" class="hidden">
    <header class="player-header">
      <button
        class="back-button"
        id="backButton"
        type="button"
      >← すべての曲</button>

      <span class="now-playing">NOW PLAYING</span>
    </header>

    <main class="player-main">
      <div class="cover-stage">
        <div class="cover-glow"></div>

        <div class="cover" id="cover">
          <img id="coverImage" src="" alt="ジャケット画像">
        </div>
      </div>

      <div class="track-details">
        <h2 class="player-title" id="currentTitle"></h2>
        <div class="player-artist">Shidanna</div>
        <div class="sound-line"></div>
      </div>

      <audio id="audio" preload="metadata"></audio>

      <div class="playback-area">
        <input
          id="seekBar"
          type="range"
          min="0"
          max="100"
          step="0.01"
          value="0"
          aria-label="再生位置"
        >

        <div class="time-row">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>

        <div class="controls">
          <button
            class="control"
            id="prevButton"
            type="button"
            aria-label="前の曲"
          >|◀</button>

          <button
            class="play-button is-paused"
            id="playButton"
            type="button"
            aria-label="再生"
          >▶</button>

          <button
            class="control"
            id="nextButton"
            type="button"
            aria-label="次の曲"
          >▶|</button>
        </div>

        <p
          class="player-message"
          id="message"
          aria-live="polite"
        >曲を選択してください。</p>
      </div>
    </main>

    <footer class="player-footer">
      ECHOES · SHIDANNA
    </footer>
  </section>

  <script>
    /*
      音源と画像のファイル名は、
      GitHubのassetsフォルダ内の名前と一致させてください。
    */

    const tracks = [
      {
        title: "タイトルループ",
        src: "assets/タイトルループ.m4a",
        cover: "assets/タイトルループ.jpg"
      },
      {
        title: "在りし日の唄",
        src: "assets/在りし日の唄.m4a",
        cover: "assets/在りし日の唄.jpg"
      },
      {
        title: "往く地の果てには",
        src: "assets/往く地の果てには.m4a",
        cover: "assets/往く地の果てには.jpg"
      },
      {
        title: "王の子は煉獄に踊る",
        src: "assets/王の子は煉獄に踊る.m4a",
        cover: "assets/王の子は煉獄に踊る.jpg"
      },
      {
        title: "神よ、その黄昏よ",
        src: "assets/神よ、その黄昏よ.m4a",
        cover: "assets/神よ、その黄昏よ.jpg"
      }
    ];

    const listScreen = document.getElementById("listScreen");
    const playerScreen = document.getElementById("playerScreen");
    const trackList = document.getElementById("trackList");

    const audio = document.getElementById("audio");
    const cover = document.getElementById("cover");
    const coverImage = document.getElementById("coverImage");
    const currentTitle = document.getElementById("currentTitle");

    const playButton = document.getElementById("playButton");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const backButton = document.getElementById("backButton");

    const seekBar = document.getElementById("seekBar");
    const currentTime = document.getElementById("currentTime");
    const duration = document.getElementById("duration");
    const message = document.getElementById("message");

    let currentIndex = -1;
    let animationFrameId = null;
    let isSeeking = false;

    /* 時間を 0:00 形式に変換 */

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) {
        return "0:00";
      }

      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = Math.floor(seconds % 60);

      return `${minutes}:${String(remainingSeconds).padStart(2, "0")}`;
    }

    /* バーの見た目を更新 */

    function updateSeekBarAppearance() {
      const progress = Math.max(
        0,
        Math.min(100, Number(seekBar.value) || 0)
      );

      seekBar.style.setProperty("--progress", `${progress}%`);
    }

    /* 曲一覧を生成 */

    function renderList() {
      trackList.replaceChildren();

      tracks.forEach((track, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "track";

        const image = document.createElement("img");
        image.className = "track-cover";
        image.src = track.cover;
        image.alt = "";
        image.loading = "lazy";

        image.addEventListener("error", () => {
          image.style.visibility = "hidden";
        });

        const info = document.createElement("span");
        info.className = "track-info";

        const title = document.createElement("span");
        title.className = "track-title";
        title.textContent = track.title;

        const subtitle = document.createElement("span");
        subtitle.className = "track-subtitle";
        subtitle.textContent = "SHIDANNA";

        const arrow = document.createElement("span");
        arrow.className = "track-arrow";
        arrow.textContent = "›";
        arrow.setAttribute("aria-hidden", "true");

        info.append(title, subtitle);
        button.append(image, info, arrow);

        button.addEventListener("click", () => {
          openTrack(index);
        });

        trackList.appendChild(button);
      });
    }

    /* 再生バーのアニメーションを停止 */

    function stopBarAnimation() {
      if (animationFrameId !== null) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
    }

    /* 再生中のバーを滑らかに更新 */

    function updatePlaybackBar() {
      if (
        audio.paused ||
        audio.ended ||
        !Number.isFinite(audio.duration) ||
        audio.duration <= 0
      ) {
        animationFrameId = null;
        return;
      }

      if (!isSeeking) {
        seekBar.value =
          (audio.currentTime / audio.duration) * 100;

        currentTime.textContent =
          formatTime(audio.currentTime);

        updateSeekBarAppearance();
      }

      animationFrameId =
        requestAnimationFrame(updatePlaybackBar);
    }

    /* バーの更新を開始 */

    function startBarAnimation() {
      stopBarAnimation();
      updatePlaybackBar();
    }

    /* 再生ボタンの表示を更新 */

    function updatePlayButton() {
      if (audio.paused) {
        playButton.textContent = "▶";
        playButton.classList.add("is-paused");
        playButton.setAttribute("aria-label", "再生");
        playerScreen.classList.remove("is-playing");
      } else {
        playButton.textContent = "Ⅱ";
        playButton.classList.remove("is-paused");
        playButton.setAttribute("aria-label", "一時停止");
        playerScreen.classList.add("is-playing");
      }
    }

    /* 曲を選択して再生画面へ */

    function openTrack(index, animateScreen = true, direction = null) {
      if (index < 0 || index >= tracks.length) {
        return;
      }

      stopBarAnimation();
      audio.pause();

      currentIndex = index;
      const track = tracks[currentIndex];

      isSeeking = false;

      currentTitle.textContent = track.title;

      coverImage.onload = () => {
        coverImage.alt = track.title + "のジャケット";
      };

      coverImage.onerror = () => {
        message.textContent = "ジャケット画像を読み込めません。";
      };

      coverImage.src = track.cover;

      playerScreen.style.setProperty(
        "--cover-bg",
        `url("${track.cover}")`
      );

      audio.src = track.src;
      audio.load();

      seekBar.value = 0;
      updateSeekBarAppearance();

      currentTime.textContent = "0:00";
      duration.textContent = "0:00";

      playButton.textContent = "▶";
      playButton.classList.add("is-paused");
      playButton.setAttribute("aria-label", "再生");

      playerScreen.classList.remove("is-playing");

      listScreen.classList.add("hidden");
      playerScreen.classList.remove("hidden");

      playerScreen.classList.remove("fade-in");

      if (animateScreen) {
        void playerScreen.offsetWidth;
        playerScreen.classList.add("fade-in");
      }

      cover.classList.remove("slide-next", "slide-prev");

      if (direction) {
        void cover.offsetWidth;

        cover.classList.add(
          direction === "next" ? "slide-next" : "slide-prev"
        );
      }

      message.textContent = "再生ボタンを押してください。";
    }

    /* 再生・一時停止ボタン */

    playButton.addEventListener("click", async () => {
      if (currentIndex < 0) {
        message.textContent = "曲を選択してください。";
        return;
      }

      if (audio.paused) {
        try {
          await audio.play();
        } catch (error) {
          console.error("音源の再生に失敗しました:", error);

          message.textContent =
            "再生できません。音源ファイルの名前と保存場所を確認してください。";
        }
      } else {
        audio.pause();
      }
    });

    /* 再生が始まったとき */

    audio.addEventListener("play", () => {
      updatePlayButton();
      message.textContent = "再生中";
      startBarAnimation();
    });

    /* 一時停止したとき */

    audio.addEventListener("pause", () => {
      updatePlayButton();
      stopBarAnimation();

      if (
        Number.isFinite(audio.duration) &&
        audio.duration > 0 &&
        !isSeeking
      ) {
        seekBar.value =
          (audio.currentTime / audio.duration) * 100;

        currentTime.textContent =
          formatTime(audio.currentTime);

        updateSeekBarAppearance();
      }

      if (audio.currentTime > 0 && !audio.ended) {
        message.textContent = "一時停止中";
      }
    });

    /* 曲の長さを取得 */

    audio.addEventListener("loadedmetadata", () => {
      duration.textContent = formatTime(audio.duration);
      currentTime.textContent = formatTime(audio.currentTime);

      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        seekBar.value =
          (audio.currentTime / audio.duration) * 100;
      } else {
        seekBar.value = 0;
      }

      updateSeekBarAppearance();
    });

    /* バーをドラッグして再生位置を変更 */

    seekBar.addEventListener("input", () => {
      if (
        !Number.isFinite(audio.duration) ||
        audio.duration <= 0
      ) {
        return;
      }

      isSeeking = true;

      audio.currentTime =
        (Number(seekBar.value) / 100) * audio.duration;

      currentTime.textContent =
        formatTime(audio.currentTime);

      updateSeekBarAppearance();
    });

    /* ドラッグ終了後に通常の更新へ戻す */

    seekBar.addEventListener("change", () => {
      isSeeking = false;

      if (!audio.paused) {
        startBarAnimation();
      }
    });

    /* 前の曲 */

    prevButton.addEventListener("click", () => {
      if (currentIndex < 0) {
        return;
      }

      const nextIndex =
        (currentIndex - 1 + tracks.length) % tracks.length;

      openTrack(nextIndex, false, "prev");
    });

    /* 次の曲 */

    nextButton.addEventListener("click", () => {
      if (currentIndex < 0) {
        return;
      }

      const nextIndex =
        (currentIndex + 1) % tracks.length;

      openTrack(nextIndex, false, "next");
    });

    /* 曲一覧に戻る */

    backButton.addEventListener("click", () => {
      audio.pause();
      stopBarAnimation();

      playerScreen.classList.add("hidden");
      playerScreen.classList.remove("is-playing");

      listScreen.classList.remove("hidden");
      listScreen.classList.remove("fade-in");

      void listScreen.offsetWidth;
      listScreen.classList.add("fade-in");
    });

    /* 曲の再生が終了したとき */

    audio.addEventListener("ended", () => {
      stopBarAnimation();

      seekBar.value = 100;
      currentTime.textContent = formatTime(audio.duration);
      updateSeekBarAppearance();

      updatePlayButton();
      message.textContent = "再生が終了しました。";
    });

    /* 音源の読み込みエラー */

    audio.addEventListener("error", () => {
      if (currentIndex >= 0) {
        stopBarAnimation();
        updatePlayButton();

        message.textContent =
          "音源を読み込めません。assetsフォルダ内のファイル名を確認してください。";
      }
    });

    /* 初期化 */

    renderList();
    updateSeekBarAppearance();
  </script>

</body>
</html>
