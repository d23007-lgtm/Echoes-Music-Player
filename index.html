<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171719">
  <title>Echoes Music Player | Shidanna</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --background: #171719;
      --panel: #30272A;
      --panel-light: #3B3034;
      --red: #A51F2B;
      --red-hover: #C02A37;
      --ivory: #F0E9D9;
      --muted: #C5B8B0;
      --line: #514044;
      --gold: #B6A078;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--ivory);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN",
        Meiryo, sans-serif;
    }

    main {
      width: min(100%, 430px);
      min-height: 100vh;
      margin: auto;
      padding: 28px 22px;
      background:
        radial-gradient(
          ellipse at top,
          #493238 0%,
          transparent 52%
        ),
        linear-gradient(
          160deg,
          var(--panel),
          var(--background) 70%
        );
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    button {
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 4px;
    }

    .back {
      border: 0;
      background: transparent;
      color: var(--ivory);
      font-size: 14px;
      padding: 8px 0;
    }

    .back:hover {
      color: var(--gold);
    }

    h1 {
      font-family: Georgia, "Yu Mincho", serif;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: .12em;
      margin: 0;
    }

    .subtitle {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .2em;
      margin-top: 8px;
    }

    /* 曲一覧 */

    .track {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 12px 8px;
      border: 0;
      border-bottom: 1px solid var(--line);
      color: var(--ivory);
      background: transparent;
      text-align: left;
      transition: background .2s ease;
    }

    .track:hover,
    .track:focus-visible {
      background: #A51F2B22;
    }

    .track-cover {
      width: 60px;
      height: 60px;
      flex-shrink: 0;
      object-fit: cover;
      border: 1px solid #6B5555;
      border-radius: 2px;
      background: var(--panel);
    }

    .track-info {
      flex: 1;
      min-width: 0;
    }

    .track-title {
      display: block;
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .track-subtitle {
      display: block;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .12em;
      margin-top: 4px;
    }

    .arrow {
      color: var(--gold);
      flex-shrink: 0;
      font-size: 22px;
    }

    /* 再生画面 */

    #playerScreen {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-height: 100vh;
      margin: -28px -22px;
      padding: 28px 22px;
      background: var(--background);
    }

    /* ジャケットを拡大したぼかし背景 */

    #playerScreen::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: -35px;
      background-image: var(--cover-bg, none);
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      filter: blur(30px) brightness(.48) saturate(.85);
      transform: scale(1.08);
    }

    /* 背景を暗くして文字を読みやすくする */

    #playerScreen::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(23, 23, 25, .48) 0%,
        rgba(23, 23, 25, .65) 45%,
        rgba(23, 23, 25, .94) 100%
      );
      pointer-events: none;
    }

    #playerScreen > * {
      position: relative;
    }

    .player-header {
      margin-bottom: 26px;
    }

    .player-header .back {
      font-size: 14px;
    }

    /* 中央のジャケット */

    .cover {
      width: min(100%, 310px);
      aspect-ratio: 1 / 1;
      margin: 0 auto 28px;
      background: var(--panel);
      border: 1px solid #6B5555;
      overflow: hidden;
      box-shadow: 0 16px 40px #00000045;
    }

    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .player-title {
      text-align: center;
      font-family: Georgia, "Yu Mincho", serif;
      font-size: 21px;
      font-weight: 500;
      line-height: 1.6;
      letter-spacing: .06em;
      overflow-wrap: anywhere;
      margin: 0 0 8px;
    }

    .player-subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    /* 再生位置 */

    .progress-area {
      margin-top: 24px;
    }

    #seekBar {
      display: block;
      width: 100%;
      height: 4px;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      border-radius: 0;
      background: var(--line);
      cursor: pointer;
      accent-color: var(--gold);
    }

    #seekBar::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--ivory);
      border: 1px solid var(--gold);
    }

    #seekBar::-moz-range-thumb {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--ivory);
      border: 1px solid var(--gold);
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      margin-top: 12px;
      font-variant-numeric: tabular-nums;
    }

    /* 再生コントロール */

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 34px;
      margin-top: 30px;
    }

    .control-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--ivory);
      font-size: 22px;
      transition:
        color .2s ease,
        background .2s ease,
        transform .2s ease;
    }

    .control-button:hover {
      color: var(--gold);
      transform: scale(1.06);
    }

    .play-button {
      width: 62px;
      height: 62px;
      background: var(--red);
      color: var(--ivory);
      font-size: 24px;
      box-shadow: 0 5px 20px #00000035;
    }

    .play-button:hover {
      background: var(--red-hover);
      color: var(--ivory);
    }

    .play-button:active {
      transform: scale(.96);
    }

    .status-message {
      min-height: 18px;
      margin-top: 20px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
      text-align: center;
    }

    /* スマートフォンでの表示調整 */

    @media (max-width: 360px) {
      main {
        padding-right: 16px;
        padding-left: 16px;
      }

      #playerScreen {
        margin-right: -16px;
        margin-left: -16px;
        padding-right: 16px;
        padding-left: 16px;
      }

      .cover {
        width: min(100%, 280px);
      }

      .controls {
        gap: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
        /* 画面の表示・非表示 */
    .hidden {
      display: none !important;
    }

    /* 補足メッセージ */
    .note {
      min-height: 18px;
      margin-top: 20px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
      text-align: center;
    }

    /* 再生ボタンのクラス名をHTMLに合わせる */
    .control {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--ivory);
      font-size: 22px;
      transition: color .2s ease, transform .2s ease;
    }

    .control:hover {
      color: var(--gold);
      transform: scale(1.06);
    }

    .play {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 62px;
      height: 62px;
      border: 0;
      border-radius: 50%;
      background: var(--red);
      color: var(--ivory);
      font-size: 24px;
      box-shadow: 0 5px 20px #00000035;
      transition: background .2s ease, transform .2s ease;
    }

    .play:hover {
      background: var(--red-hover);
    }

    .play:active {
      transform: scale(.96);
    }
  </style>
</head>

<body>
  <main>
    <section id="listScreen">
      <header>
        <div>
          <h1>すべての曲</h1>
          <div class="subtitle">Music Collection</div>
        </div>
      </header>

      <div id="trackList"></div>
      <p class="note">曲を選択すると再生画面に移動します。</p>
    </section>

    <section id="playerScreen" class="hidden">
      <header>
        <button class="back" id="backButton">← 曲一覧</button>
      </header>

      <div class="cover">
        <img id="coverImage" src="" alt="ジャケット画像">
      </div>

      <h2 class="player-title" id="currentTitle"></h2>
      <div class="player-subtitle">Shidanna</div>

      <audio id="audio" preload="metadata"></audio>

      <input
        id="seekBar"
        type="range"
        min="0"
        max="100"
        value="0"
        aria-label="再生位置"
      >

      <div class="time-row">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>

      <div class="controls">
        <button
          class="control"
          id="prevButton"
          aria-label="前の曲"
        >|◀</button>

        <button
          class="play"
          id="playButton"
          aria-label="再生"
        >▶</button>

        <button
          class="control"
          id="nextButton"
          aria-label="次の曲"
        >▶|</button>
      </div>

      <p class="note" id="message">曲を選択してください。</p>
    </section>
  </main>

  <script>
    const tracks = [
      {
        title: "タイトルループ",
        src: "assets/タイトルループ.m4a",
        cover: "assets/タイトルループ.jpg"
      },
      {
        title: "在りし日の唄",
        src: "assets/在りし日の唄.m4a",
        cover: "assets/在りし日の唄.jpg"
      },
      {
        title: "往く地の果てには",
        src: "assets/往く地の果てには.m4a",
        cover: "assets/往く地の果てには.jpg"
      },
      {
        title: "王の子は煉獄に踊る",
        src: "assets/王の子は煉獄に踊る.m4a",
        cover: "assets/王の子は煉獄に踊る.jpg"
      },
      {
        title: "神よ、その黄昏よ",
        src: "assets/神よ、その黄昏よ.m4a",
        cover: "assets/神よ、その黄昏よ.jpg"
      }
    ];

    let currentIndex = 0;

    const listScreen = document.getElementById("listScreen");
    const playerScreen = document.getElementById("playerScreen");
    const trackList = document.getElementById("trackList");
    const audio = document.getElementById("audio");
    const playButton = document.getElementById("playButton");
    const seekBar = document.getElementById("seekBar");
    const message = document.getElementById("message");
    const coverImage = document.getElementById("coverImage");
    const currentTitle = document.getElementById("currentTitle");
    const currentTime = document.getElementById("currentTime");
    const duration = document.getElementById("duration");

    function renderList() {
      trackList.innerHTML = "";

      tracks.forEach((track, index) => {
        const button = document.createElement("button");
        button.className = "track";
        button.type = "button";

        const cover = document.createElement("img");
        cover.className = "track-cover";
        cover.src = track.cover;
        cover.alt = "";
        cover.loading = "lazy";

        const info = document.createElement("span");
        info.className = "track-info";

        const title = document.createElement("span");
        title.className = "track-title";
        title.textContent = track.title;

        const subtitle = document.createElement("span");
        subtitle.className = "track-subtitle";
        subtitle.textContent = "Shidanna";

        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = "›";
        arrow.setAttribute("aria-hidden", "true");

        info.append(title, subtitle);
        button.append(cover, info, arrow);

        button.addEventListener("click", () => openTrack(index));
        trackList.appendChild(button);
      });
    }

  function openTrack(index) {
  currentIndex = (index + tracks.length) % tracks.length;
  const track = tracks[currentIndex];

  audio.pause();
  audio.src = track.src;
  audio.load();

  currentTitle.textContent = track.title;
  coverImage.src = track.cover;
  coverImage.alt = track.title + "のジャケット";

  // 選択した曲のジャケットを背景画像に設定
  playerScreen.style.setProperty(
    "--cover-bg",
    `url("${track.cover}")`
  );

  listScreen.classList.add("hidden");
  playerScreen.classList.remove("hidden");

  playButton.textContent = "▶";
  playButton.setAttribute("aria-label", "再生");
  seekBar.value = 0;
  currentTime.textContent = "0:00";
  duration.textContent = "0:00";
  message.textContent = "再生ボタンを押してください。";
}
    
    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";

      const minutes = Math.floor(seconds / 60);
      const remaining = Math.floor(seconds % 60);

      return minutes + ":" + String(remaining).padStart(2, "0");
    }

    playButton.addEventListener("click", async () => {
      if (!audio.getAttribute("src")) {
        message.textContent = "曲を選択してください。";
        return;
      }

      if (audio.paused) {
        try {
          await audio.play();
        } catch (error) {
          message.textContent =
            "音源を読み込めません。ファイル名と保存場所を確認してください。";
        }
      } else {
        audio.pause();
      }
    });

    audio.addEventListener("play", () => {
      playButton.textContent = "Ⅱ";
      playButton.setAttribute("aria-label", "一時停止");
      message.textContent = "再生中";
    });

    audio.addEventListener("pause", () => {
      playButton.textContent = "▶";
      playButton.setAttribute("aria-label", "再生");

      if (audio.currentTime > 0 && !audio.ended) {
        message.textContent = "一時停止中";
      }
    });

    document.getElementById("backButton").addEventListener("click", () => {
      audio.pause();
      listScreen.classList.remove("hidden");
      playerScreen.classList.add("hidden");
    });

    document.getElementById("prevButton").addEventListener("click", () => {
      openTrack(currentIndex - 1);
    });

    document.getElementById("nextButton").addEventListener("click", () => {
      openTrack(currentIndex + 1);
    });

    audio.addEventListener("loadedmetadata", () => {
      duration.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", () => {
      currentTime.textContent = formatTime(audio.currentTime);

      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        seekBar.value = audio.currentTime / audio.duration * 100;
      }
    });

    seekBar.addEventListener("input", () => {
      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        audio.currentTime =
          Number(seekBar.value) / 100 * audio.duration;
      }
    });

    audio.addEventListener("ended", () => {
      playButton.textContent = "▶";
      playButton.setAttribute("aria-label", "再生");
      message.textContent = "再生が終了しました。";
    });

    audio.addEventListener("error", () => {
      if (audio.getAttribute("src")) {
        message.textContent =
          "音源を読み込めません。ファイル名と保存場所を確認してください。";
      }
    });

    renderList();
  </script>
</body>
</html>
