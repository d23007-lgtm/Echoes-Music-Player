<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#211719">
  <title>Echoes Music Player | Shidanna</title>

  <style>
    :root {
      --background: #211719;
      --panel: #302326;
      --text: #f5eee5;
      --muted: #b9a9a6;
      --accent: #d4b477;
      --border: #6b5555;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px 40px;
      color: var(--text);
      background:
        radial-gradient(ellipse at top, #493036 0%, transparent 55%),
        var(--background);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
      cursor: pointer;
    }

    .app {
      width: min(100%, 430px);
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .brand {
      margin: 0;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .brand-subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.2em;
    }

    .back-button {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: #ffffff08;
      font-size: 20px;
    }

    .screen {
      animation: fadeIn 0.25s ease both;
    }

    .screen.hidden {
      display: none;
    }

    .section-title {
      margin: 0 0 18px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.12em;
    }

    .track-list {
      display: grid;
      gap: 10px;
    }

    .track {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border: 1px solid #ffffff12;
      border-radius: 12px;
      background: #ffffff06;
      text-align: left;
      transition: background 0.2s ease;
    }

    .track:hover {
      background: #ffffff12;
    }

    .track-cover {
      width: 58px;
      height: 58px;
      flex-shrink: 0;
      border-radius: 5px;
      object-fit: cover;
      background: var(--panel);
    }

    .track-info {
      min-width: 0;
    }

    .track-title {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .track-label {
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.15em;
    }

    .track-arrow {
      margin-left: auto;
      color: var(--accent);
      font-size: 18px;
    }

    .player {
      text-align: center;
    }

    .cover {
      position: relative;
      width: min(100%, 310px);
      aspect-ratio: 1 / 1;
      margin: 0 auto 28px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--panel);
      box-shadow: 0 16px 40px #00000045;
    }

    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cover-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--accent);
    }

    .seal {
      display: grid;
      width: 68px;
      height: 68px;
      place-items: center;
      border: 1px solid var(--accent);
      font-size: 30px;
    }

    .cover-placeholder p {
      margin: 0;
      font-size: 13px;
    }

    /* 曲を切り替えるとジャケットが横から入る */
    .cover.slide-next {
      animation: coverSlideNext 0.22s ease-out both;
    }

    .cover.slide-prev {
      animation: coverSlidePrev 0.22s ease-out both;
    }

    @keyframes coverSlideNext {
      from {
        transform: translateX(18px);
      }
      to {
        transform: translateX(0);
      }
    }

    @keyframes coverSlidePrev {
      from {
        transform: translateX(-18px);
      }
      to {
        transform: translateX(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .player-title {
      margin: 0;
      font-size: 21px;
      font-weight: 600;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .player-subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.25em;
    }

    .progress-area {
      margin-top: 32px;
    }

    .seek-bar {
      display: block;
      width: 100%;
      height: 5px;
      margin: 0;
      border-radius: 10px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      background: #ffffff2b;
      cursor: pointer;
    }

    .seek-bar::-webkit-slider-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      appearance: none;
      -webkit-appearance: none;
      background: var(--accent);
      box-shadow: 0 0 8px #00000035;
    }

    .seek-bar::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: none;
      border-radius: 50%;
      background: var(--accent);
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      margin-top: 24px;
    }

    .control-button {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text);
      font-size: 23px;
    }

    .control-button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .play-button {
      width: 62px;
      height: 62px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #261c18;
      font-size: 25px;
      box-shadow: 0 5px 22px #00000030;
    }

    .message {
      min-height: 20px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .footer {
      margin-top: 38px;
      color: #a18f8d;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="header">
      <div>
        <h1 class="brand">Echoes Music Player</h1>
        <div class="brand-subtitle">SHIDANNA</div>
      </div>

      <button
        class="back-button"
        id="backButton"
        type="button"
        aria-label="曲一覧に戻る"
        hidden
      >←</button>
    </header>

    <section class="screen" id="listScreen">
      <h2 class="section-title">MUSIC LIBRARY</h2>
      <div class="track-list" id="trackList"></div>
    </section>

    <section class="screen hidden" id="playerScreen">
      <div class="player">
        <div class="cover" id="cover">
          <div class="cover-placeholder" id="coverPlaceholder">
            <div class="seal">唄</div>
            <p>在りし日の唄</p>
          </div>
          <img id="coverImage" src="" alt="ジャケット画像" hidden>
        </div>

        <h2 class="player-title" id="currentTitle"></h2>
        <div class="player-subtitle">SOUNDTRACK</div>

        <audio id="audio" preload="metadata"></audio>

        <div class="progress-area">
          <input
            class="seek-bar"
            id="seekBar"
            type="range"
            min="0"
            max="100"
            step="0.01"
            value="0"
            aria-label="再生位置"
          >

          <div class="time-row">
            <span id="currentTime">0:00</span>
            <span id="durationTime">0:00</span>
          </div>
        </div>

        <div class="controls">
          <button
            class="control-button"
            id="prevButton"
            type="button"
            aria-label="前の曲"
          >|◀</button>

          <button
            class="control-button play-button"
            id="playButton"
            type="button"
            aria-label="再生"
          >▶</button>

          <button
            class="control-button"
            id="nextButton"
            type="button"
            aria-label="次の曲"
          >▶|</button>
        </div>

        <p class="message" id="message" aria-live="polite"></p>
      </div>
    </section>

    <footer class="footer">MUSIC IS A MEMORY.</footer>
  </main>

  <script>
    // 音源とジャケットのファイル名は、GitHub上の名前と一致させてください。
    const tracks = [
      {
        title: "タイトルループ",
        src: "assets/タイトルループ.m4a",
        cover: "assets/タイトルループ.jpg"
      },
      {
        title: "在りし日の唄",
        src: "assets/在りし日の唄.m4a",
        cover: "assets/在りし日の唄.jpg"
      },
      {
        title: "往く地の果てには",
        src: "assets/往く地の果てには.m4a",
        cover: "assets/往く地の果てには.jpg"
      },
      {
        title: "王の子は煉獄に踊る",
        src: "assets/王の子は煉獄に踊る.m4a",
        cover: "assets/王の子は煉獄に踊る.jpg"
      },
      {
        title: "神よ、その黄昏よ",
        src: "assets/神よ、その黄昏よ.m4a",
        cover: "assets/神よ、その黄昏よ.jpg"
      }
    ];

    const listScreen = document.getElementById("listScreen");
    const playerScreen = document.getElementById("playerScreen");
    const trackList = document.getElementById("trackList");
    const backButton = document.getElementById("backButton");

    const audio = document.getElementById("audio");
    const cover = document.getElementById("cover");
    const coverImage = document.getElementById("coverImage");
    const coverPlaceholder = document.getElementById("coverPlaceholder");

    const currentTitle = document.getElementById("currentTitle");
    const currentTime = document.getElementById("currentTime");
    const durationTime = document.getElementById("durationTime");
    const seekBar = document.getElementById("seekBar");
    const playButton = document.getElementById("playButton");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const message = document.getElementById("message");

    let currentIndex = -1;
    let animationFrameId = null;
    let isSeeking = false;

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) {
        return "0:00";
      }

      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = Math.floor(seconds % 60);

      return `${minutes}:${String(remainingSeconds).padStart(2, "0")}`;
    }

    function renderList() {
      trackList.replaceChildren();

      tracks.forEach((track, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "track";

        const image = document.createElement("img");
        image.className = "track-cover";
        image.src = track.cover;
        image.alt = "";
        image.loading = "lazy";

        image.addEventListener("error", () => {
          image.style.visibility = "hidden";
        });

        const info = document.createElement("div");
        info.className = "track-info";

        const title = document.createElement("p");
        title.className = "track-title";
        title.textContent = track.title;

        const label = document.createElement("div");
        label.className = "track-label";
        label.textContent = "SOUNDTRACK";

        info.append(title, label);

        const arrow = document.createElement("span");
        arrow.className = "track-arrow";
        arrow.textContent = "›";

        button.append(image, info, arrow);
        button.addEventListener("click", () => openTrack(index));

        trackList.appendChild(button);
      });
    }

    function stopBarAnimation() {
      if (animationFrameId !== null) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
    }

    // 再生中だけ、画面の描画タイミングに合わせてバーを更新する
    function updatePlaybackBar() {
      if (audio.paused || audio.ended || !Number.isFinite(audio.duration)) {
        animationFrameId = null;
        return;
      }

      if (!isSeeking) {
        seekBar.value = (audio.currentTime / audio.duration) * 100;
        currentTime.textContent = formatTime(audio.currentTime);
      }

      animationFrameId = requestAnimationFrame(updatePlaybackBar);
    }

    function startBarAnimation() {
      stopBarAnimation();
      updatePlaybackBar();
    }

    function updatePlayButton() {
      if (audio.paused) {
        playButton.textContent = "▶";
        playButton.setAttribute("aria-label", "再生");
      } else {
        playButton.textContent = "Ⅱ";
        playButton.setAttribute("aria-label", "一時停止");
      }
    }

    function showPlayer() {
      listScreen.classList.add("hidden");
      playerScreen.classList.remove("hidden");
      backButton.hidden = false;
    }

    function showList() {
      audio.pause();
      stopBarAnimation();

      playerScreen.classList.add("hidden");
      listScreen.classList.remove("hidden");
      backButton.hidden = true;

      message.textContent = "";
    }

    function openTrack(index, animateScreen = true, direction = null) {
      if (index < 0 || index >= tracks.length) return;

      stopBarAnimation();
      audio.pause();

      currentIndex = index;
      const track = tracks[currentIndex];

      message.textContent = "";
      currentTitle.textContent = track.title;

      // ジャケット画像を更新
      coverImage.hidden = true;
      coverImage.onload = () => {
        coverImage.hidden = false;
        coverPlaceholder.hidden = true;
      };

      coverImage.onerror = () => {
        coverImage.hidden = true;
        coverPlaceholder.hidden = false;
        coverPlaceholder.querySelector("p").textContent = track.title;
      };

      coverImage.src = track.cover;

      // 曲の音源を更新
      audio.src = track.src;
      audio.load();

      seekBar.value = 0;
      currentTime.textContent = "0:00";
      durationTime.textContent = "0:00";
      playButton.textContent = "▶";
      playButton.setAttribute("aria-label", "再生");

      cover.classList.remove("slide-next", "slide-prev");

      if (direction === "next") {
        void cover.offsetWidth;
        cover.classList.add("slide-next");
      } else if (direction === "prev") {
        void cover.offsetWidth;
        cover.classList.add("slide-prev");
      }

      showPlayer();

      if (animateScreen) {
        playerScreen.style.animation = "none";
        void playerScreen.offsetWidth;
        playerScreen.style.animation = "";
      }
    }

    // 再生・一時停止
    playButton.addEventListener("click", async () => {
      if (currentIndex < 0) {
        message.textContent = "曲を選択してください。";
        return;
      }

      if (audio.paused) {
        try {
          await audio.play();
          message.textContent = "";
        } catch (error) {
          console.error("音源の再生に失敗しました:", error);
          message.textContent =
            "再生できません。音源ファイルの場所と名前を確認してください。";
        }
      } else {
        audio.pause();
      }
    });

    // 再生開始時
    audio.addEventListener("play", () => {
      updatePlayButton();
      startBarAnimation();
    });

    // 一時停止時
    audio.addEventListener("pause", () => {
      updatePlayButton();
      stopBarAnimation();

      if (Number.isFinite(audio.duration) && !isSeeking) {
        seekBar.value = (audio.currentTime / audio.duration) * 100;
        currentTime.textContent = formatTime(audio.currentTime);
      }
    });

    // 曲の長さが読み込まれたとき
    audio.addEventListener("loadedmetadata", () => {
      durationTime.textContent = formatTime(audio.duration);

      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        seekBar.value = (audio.currentTime / audio.duration) * 100;
      }
    });

    // シークバーを操作している間は、再生位置をドラッグに合わせる
    seekBar.addEventListener("input", () => {
      if (!Number.isFinite(audio.duration) || audio.duration <= 0) {
        return;
      }

      isSeeking = true;

      const percentage = Number(seekBar.value) / 100;
      audio.currentTime = percentage * audio.duration;
      currentTime.textContent = formatTime(audio.currentTime);
    });

    seekBar.addEventListener("change", () => {
      isSeeking = false;

      if (!audio.paused) {
        startBarAnimation();
      }
    });

    // 再生終了時
    audio.addEventListener("ended", () => {
      stopBarAnimation();
      seekBar.value = 100;
      currentTime.textContent = formatTime(audio.duration);
      updatePlayButton();
    });

    // 音源の読み込みエラー
    audio.addEventListener("error", () => {
      if (currentIndex >= 0) {
        message.textContent =
          "音源を読み込めません。assets内のファイル名を確認してください。";
      }
    });

    // 前の曲
    prevButton.addEventListener("click", () => {
      if (currentIndex > 0) {
        openTrack(currentIndex - 1, false, "prev");
      }
    });

    // 次の曲
    nextButton.addEventListener("click", () => {
      if (currentIndex < tracks.length - 1) {
        openTrack(currentIndex + 1, false, "next");
      }
    });

    // 曲一覧へ戻る
    backButton.addEventListener("click", showList);

    // 最初の一覧を表示
    renderList();
  </script>
</body>
</html>
