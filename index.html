<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171719">
  <title>Echoes Music Player | Shidanna</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --background: #171719;
      --panel: #30272A;
      --red: #A51F2B;
      --red-hover: #C02A37;
      --ivory: #F0E9D9;
      --muted: #C5B8B0;
      --line: #514044;
      --gold: #B6A078;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--ivory);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN",
        Meiryo, sans-serif;
    }

    main {
      width: min(100%, 430px);
      min-height: 100vh;
      margin: auto;
      padding: 28px 22px;
      background: linear-gradient(160deg, #30272A, #171719 70%);
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    button {
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 4px;
    }

    h1 {
      font-family: Georgia, "Yu Mincho", serif;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: .12em;
      margin: 0;
    }

    .subtitle {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .2em;
      margin-top: 8px;
      text-transform: uppercase;
    }

    /* 曲一覧 */

    .track {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 12px 8px;
      border: 0;
      border-bottom: 1px solid var(--line);
      color: var(--ivory);
      background: transparent;
      text-align: left;
      transition: background .2s ease;
    }

    .track:hover,
    .track:focus-visible {
      background: #A51F2B22;
    }

    .track-cover {
      width: 60px;
      height: 60px;
      flex-shrink: 0;
      object-fit: cover;
      border: 1px solid #6B5555;
      border-radius: 2px;
      background: var(--panel);
    }

    .track-info {
      flex: 1;
      min-width: 0;
    }

    .track-title {
      display: block;
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .track-subtitle {
      display: block;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .12em;
      margin-top: 4px;
    }

    .arrow {
      color: var(--gold);
      flex-shrink: 0;
      font-size: 22px;
    }

    /* 再生画面 */

    #playerScreen {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-height: 100vh;
      margin: -28px -22px;
      padding: 28px 22px;
      background: var(--background);
    }

    /* ジャケットを拡大したぼかし背景 */

    #playerScreen::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: -35px;
      background-image: var(--cover-bg, none);
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      filter: blur(30px) brightness(.48) saturate(.85);
      transform: scale(1.08);
      transition: opacity .4s ease;
    }

    /* 背景を暗くして文字を読みやすくする */

    #playerScreen::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(23, 23, 25, .48) 0%,
        rgba(23, 23, 25, .65) 45%,
        rgba(23, 23, 25, .94) 100%
      );
      pointer-events: none;
    }

    #playerScreen > * {
      position: relative;
    }

    .player-header {
      margin-bottom: 26px;
    }

    .back {
      border: 0;
      background: transparent;
      color: var(--ivory);
      font-size: 14px;
      padding: 8px 0;
    }

    .back:hover {
      color: var(--gold);
    }

    /* 中央のジャケット */

    .cover {
      width: min(100%, 310px);
      aspect-ratio: 1 / 1;
      margin: 0 auto 28px;
      background: var(--panel);
      border: 1px solid #6B5555;
      overflow: hidden;
      box-shadow: 0 16px 40px #00000045;
    }

    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .player-title {
      text-align: center;
      font-family: Georgia, "Yu Mincho", serif;
