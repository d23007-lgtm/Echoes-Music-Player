<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echoes Music Player | Shidanna</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #17191d;
      color: #f3f0e9;
      font-family: "Yu Gothic", sans-serif;
    }

    main {
      width: min(100%, 430px);
      min-height: 100vh;
      margin: auto;
      padding: 28px 22px;
      background: linear-gradient(160deg, #292c32, #17191d 65%);
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .back {
      border: 0;
      background: transparent;
      color: #e9dfc8;
      font-size: 16px;
      padding: 8px 0;
    }

    h1 {
      font-size: 21px;
      font-weight: 500;
      letter-spacing: .12em;
      margin: 0;
    }

    .subtitle {
      color: #aaa69e;
      font-size: 11px;
      letter-spacing: .18em;
      margin-top: 7px;
    }
    
.track {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 12px;
  border: 0;
  border-bottom: 1px solid #45464a;
  color: #f3f0e9;
  background: transparent;
  text-align: left;
}

.track:hover {
  background: #ffffff0b;
}

.track-cover {
  width: 60px;
  height: 60px;
  flex-shrink: 0;
  object-fit: cover;
  border: 1px solid #55504a;
  border-radius: 3px;
  background: #33353a;
}

.track-info {
  flex: 1;
  min-width: 0;
}

.track-title {
  display: block;
  font-size: 14px;
  line-height: 1.7;
}

.track-subtitle {
  display: block;
  color: #aaa69e;
  font-size: 10px;
  letter-spacing: .12em;
  margin-top: 3px;
}

.arrow {
  color: #a9a49b;
  flex-shrink: 0;
}

.cover {
  width: min(100%, 310px);
  aspect-ratio: 1 / 1;
  margin: 0 auto 27px;
  background: #33353a;
  border: 1px solid #55504a;
  overflow: hidden;
}

.cover img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

    .cover-inner {
      border: 1px solid #877858;
      width: 100%;
      height: 100%;
      display: grid;
      place-content: center;
      gap: 12px;
    }

    .cover-mark {
      font-size: 48px;
      font-family: serif;
    }

    .cover-caption {
      font-size: 12px;
      letter-spacing: .15em;
    }

    .player-title {
      text-align: center;
      font-size: 18px;
      font-weight: 500;
      margin: 0 0 8px;
    }

    .player-subtitle {
      text-align: center;
      font-size: 11px;
      color: #aaa69e;
      margin-bottom: 30px;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      color: #b8b4ad;
      font-size: 11px;
      margin-top: 10px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #c7b58c;
      cursor: pointer;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 35px;
      margin: 30px 0;
    }

    .control {
      background: transparent;
      border: 0;
      color: #f3f0e9;
      font-size: 25px;
      min-width: 34px;
    }

    .play {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 1px solid #c7b58c;
      background: #c7b58c;
      color: #17191d;
      font-size: 24px;
    }

    .hidden { display: none; }

    .note {
      font-size: 11px;
      color: #aaa69e;
      line-height: 1.8;
      text-align: center;
      margin-top: 28px;
    }
  </style>
</head>
<body>
  <main>
    <section id="listScreen">
      <header>
        <div>
          <h1>Echoes Music Player</h1>
          <div class="subtitle">Shidanna</div>
        </div>
      </header>

      <div id="trackList"></div>
      <p class="note">曲を選択すると再生画面に移動します。</p>
    </section>

    <section id="playerScreen" class="hidden">
      <header>
        <button class="back" id="backButton">← 曲一覧</button>
      </header>

   <div class="cover">
  <img id="coverImage" src="" alt="ジャケット画像">
</div>

      <h2 class="player-title" id="currentTitle"></h2>
      <div class="player-subtitle">Shidanna</div>

      <audio id="audio" preload="metadata"></audio>

      <input id="seekBar" type="range" min="0" max="100" value="0">
      <div class="time-row">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>

      <div class="controls">
        <button class="control" id="prevButton" aria-label="前の曲">|◀</button>
        <button class="play" id="playButton" aria-label="再生">▶</button>
        <button class="control" id="nextButton" aria-label="次の曲">▶|</button>
      </div>

      <p class="note" id="message">音源はこれから設定します。</p>
    </section>
  </main>

  <script>
  
const tracks = [
  {
    title: "タイトルループ",
    src: "assets/タイトルループ.m4a",
    cover: "assets/タイトルループ.jpg"
  },
  {
    title: "在りし日の唄",
    src: "assets/在りし日の唄.m4a",
    cover: "assets/在りし日の唄.jpg"
  },
  {
    title: "往く地の果てには",
    src: "assets/往く地の果てには.m4a",
    cover: "assets/往く地の果てには.jpg"
  },
  {
    title: "王の子は煉獄に踊る",
    src: "assets/王の子は煉獄に踊る.m4a",
    cover: "assets/王の子は煉獄に踊る.jpg"
  },
  {
    title: "神よ、その黄昏よ",
    src: "assets/神よ、その黄昏よ.m4a",
    cover: "assets/神よ、その黄昏よ.jpg"
  }
];

    let currentIndex = 0;

    const listScreen = document.getElementById("listScreen");
    const playerScreen = document.getElementById("playerScreen");
    const trackList = document.getElementById("trackList");
    const audio = document.getElementById("audio");
    const playButton = document.getElementById("playButton");
    const seekBar = document.getElementById("seekBar");
    const message = document.getElementById("message");
   
function renderList() {
  trackList.innerHTML = "";

  tracks.forEach((track, index) => {
    const button = document.createElement("button");
    button.className = "track";

    // ジャケット画像
    const cover = document.createElement("img");
    cover.className = "track-cover";
    cover.src = track.cover;
    cover.alt = track.title + "のジャケット";
    cover.loading = "lazy";

    // 曲名とサブタイトル
    const info = document.createElement("span");
    info.className = "track-info";

    const title = document.createElement("span");
    title.className = "track-title";
    title.textContent = track.title;

    const subtitle = document.createElement("span");
    subtitle.className = "track-subtitle";
    subtitle.textContent = "Shidanna";

    // 右側の矢印
    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.textContent = "›";

    info.append(title, subtitle);
    button.append(cover, info, arrow);

    button.addEventListener("click", () => openTrack(index));
    trackList.appendChild(button);
  });
}

    function openTrack(index) {
      currentIndex = (index + tracks.length) % tracks.length;
      const track = tracks[currentIndex];

      document.getElementById("currentTitle").textContent = track.title;
const coverImage = document.getElementById("coverImage");
coverImage.src = track.cover;
coverImage.alt = track.title + "のジャケット";

      listScreen.classList.add("hidden");
      playerScreen.classList.remove("hidden");

      audio.pause();
      audio.src = track.src;
      audio.load();

      playButton.textContent = "▶";
      seekBar.value = 0;
      document.getElementById("currentTime").textContent = "0:00";
      document.getElementById("duration").textContent = "0:00";

      message.textContent = track.src
        ? "再生ボタンを押してください。"
        : "この曲の音源はまだ設定されていません。";
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";
      const minutes = Math.floor(seconds / 60);
      const remaining = Math.floor(seconds % 60);
      return minutes + ":" + String(remaining).padStart(2, "0");
    }

    playButton.addEventListener("click", async () => {
      if (!audio.getAttribute("src")) {
        message.textContent = "音源を追加すると再生できます。";
        return;
      }

      if (audio.paused) {
        try {
          await audio.play();
          playButton.textContent = "Ⅱ";
          message.textContent = "再生中";
        } catch {
          message.textContent = "音源を読み込めません。ファイルの場所を確認してください。";
        }
      } else {
        audio.pause();
        playButton.textContent = "▶";
        message.textContent = "一時停止中";
      }
    });

    document.getElementById("backButton").addEventListener("click", () => {
      audio.pause();
      listScreen.classList.remove("hidden");
      playerScreen.classList.add("hidden");
      playButton.textContent = "▶";
    });

    document.getElementById("prevButton").addEventListener("click", () => {
      openTrack(currentIndex - 1);
    });

    document.getElementById("nextButton").addEventListener("click", () => {
      openTrack(currentIndex + 1);
    });

    audio.addEventListener("loadedmetadata", () => {
      document.getElementById("duration").textContent =
        formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", () => {
      document.getElementById("currentTime").textContent =
        formatTime(audio.currentTime);

      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        seekBar.value = audio.currentTime / audio.duration * 100;
      }
    });

    seekBar.addEventListener("input", () => {
      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        audio.currentTime = Number(seekBar.value) / 100 * audio.duration;
      }
    });

    audio.addEventListener("ended", () => {
      playButton.textContent = "▶";
      message.textContent = "再生が終了しました。";
    });

    renderList();
  </script>
</body>
</html>
